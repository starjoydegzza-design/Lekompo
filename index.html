<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lekompo Voting</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:15px}
h1{color:#ff1a5e;text-align:center}
#list{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:#1a1a1a;border-radius:12px;padding:10px;text-align:center}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.card h3{font-size:14px;margin:8px 0}
button{background:#ff1a5e;color:#fff;border:none;padding:8px 15px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<h1>🎧 Vote Your Favourite</h1>
<div id="status" style="text-align:center">Loading...</div>
<div id="list"></div>
<script>
async function load(){
 const r = await fetch('mixes.json?v=' + Date.now());
 const mixes = await r.json();
 document.getElementById('status').innerHTML='';
 const list=document.getElementById('list'); list.innerHTML='';
 mixes.reverse().forEach(m=>{
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`<img src="${m.cover}"><h3>${m.title}</h3><button onclick="alert('Voted for ${m.title}')">Vote ❤️</button>`;
  list.appendChild(card);
 });
}
load();
</script>
</body>
</html>
