<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lekompo Voting</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0;padding:12px}
h1{color:#ff1a5e;text-align:center;margin:10px 0}
#status{text-align:center;margin:10px;color:#aaa;font-size:14px}
#closed{background:#ff1a5e;color:#fff;text-align:center;padding:14px;border-radius:12px;margin:10px 0;font-weight:bold;display:none}
#list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1a1a1a;border-radius:16px;overflow:hidden;padding-bottom:10px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.card img{width:100%;height:160px;object-fit:cover;display:block}
.card h3{font-size:13px;margin:8px 6px;text-align:center;min-height:32px}
.votes{text-align:center;font-size:12px;color:#ff8fab;margin:2px 0}
button{background:#ff1a5e;color:#fff;border:none;width:92%;margin:6px 4%;padding:10px;border-radius:10px;font-weight:bold;font-size:14px}
button:disabled{background:#444;color:#999}
</style>
</head>
<body>
<h1>🎧 Lekompo Mix Battle</h1>
<div id="closed"></div>
<div id="status">Loading mixes...</div>
<div id="list"></div>
<script>
const NAMESPACE = "lekompo-2026-v1";
function isWeekendOpen(){
  const now = new Date();
  const day = now.getDay();
  return day === 6 || day === 0;
}
function getWeekendKey(){
  const now = new Date();
  const day = now.getDay();
  const sat = new Date(now);
  if(day === 0){ sat.setDate(now.getDate() - 1); } // Sunday -> Saturday was yesterday
  // YYYY-MM-DD of Saturday = unique ID for this weekend
  return `${sat.getFullYear()}-${sat.getMonth()+1}-${sat.getDate()}`;
}
async function load(){
  try{
    const r = await fetch('mixes.json?v=' + Date.now());
    const mixes = await r.json();
    const list = document.getElementById('list');
    list.innerHTML = '';
    const open = isWeekendOpen();
    const weekendKey = getWeekendKey();
    const saved = JSON.parse(localStorage.getItem('lekompo_vote') || 'null');
    // If saved vote is from old weekend, clear it - allow new vote this weekend
    if(saved && saved.weekendKey !== weekendKey && open){
      localStorage.removeItem('lekompo_vote');
    }
    const currentVote = JSON.parse(localStorage.getItem('lekompo_vote') || 'null');
    const hasVotedThisWeekend = currentVote && currentVote.weekendKey === weekendKey;
    if(!open){
      document.getElementById('closed').style.display='block';
      document.getElementById('closed').innerText='🔒 VOTING CLOSED - Opens Saturday 00:00 to Sunday 23:59 (SA Time)';
      document.getElementById('status').innerText='You can view mixes, but voting is closed now';
    } else {
      document.getElementById('closed').style.display='none';
      document.getElementById('status').innerText=`${mixes.length} mixes • Voting OPEN this weekend! • 1 vote per phone THIS WEEKEND`;
    }
    for(let m of [...mixes].reverse()){
      let count = 0;
      try{
        const cr = await fetch(`https://api.countapi.xyz/get/${NAMESPACE}/${m.id}`);
        const cd = await cr.json();
        count = cd.value || 0;
      }catch(e){ count = 0; }
      let btnText = "Vote ❤️";
      let disabled = "";
      if(!open){
        btnText = "Closed 🔒";
        disabled = "disabled";
      } else if(hasVotedThisWeekend){
        btnText = currentVote.id===m.id ? "✅ Your Vote This Weekend" : "Already Voted This Weekend";
        disabled = "disabled";
      }
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${m.cover}"><h3>${m.title}</h3><div class="votes">❤️ ${count} votes</div><button ${disabled} onclick="vote('${m.id}')">${btnText}</button>`;
      list.appendChild(card);
    }
  }catch(e){
    document.getElementById('status').innerText = "No mixes found. Upload in admin.html";
  }
}
async function vote(id){
  if(!isWeekendOpen()){
    alert("🔒 Voting is closed! Only Saturday 00:00 to Sunday 23:59");
    return;
  }
  const weekendKey = getWeekendKey();
  const saved = JSON.parse(localStorage.getItem('lekompo_vote') || 'null');
  if(saved && saved.weekendKey === weekendKey){
    alert("❌ You already voted THIS WEEKEND! Come back next Saturday.");
    return;
  }
  localStorage.setItem('lekompo_vote', JSON.stringify({id, weekendKey}));
  try{ await fetch(`https://api.countapi.xyz/hit/${NAMESPACE}/${id}`); }catch(e){}
  alert("✅ Your vote for THIS WEEKEND is counted!");
  load();
}
load();
</script>
</body>
</html>
