<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEKOMPO</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0;padding:15px;text-align:center}
h1{color:#ff1a5e}
.card{background:#1a1a1a;padding:14px;border-radius:14px;margin:12px auto;max-width:500px;display:flex;gap:12px;align-items:center;border-left:5px solid #ff1a5e;text-align:left}
.card img{width:80px;height:80px;border-radius:10px;object-fit:cover}
button{background:#ff1a5e;color:#fff;border:none;padding:12px 20px;border-radius:20px;font-weight:bold}
#status{padding:12px;border-radius:10px;max-width:500px;margin:15px auto;border:1px solid #333}
</style>
</head>
<body>
<h1>🔥 LEKOMPO BATTLE 🔥</h1>
<div id="status">Loading...</div>
<div id="list"></div>
<script>
function isOpen(){let d=new Date().getDay();return d==6||d==0;}
function weekKey(){let n=new Date();let d=n.getDay();let diff=n.getDate()-d+6;let s=new Date(n);s.setDate(diff);return s.getFullYear()+'-'+s.getMonth()+'-'+s.getDate();}
async function load(){
 const s=document.getElementById('status'); const l=document.getElementById('list');
 const voted=JSON.parse(localStorage.getItem('lekompo_vote')||'null'); const key=weekKey();
 try{
  let res=await fetch('mixes.json?v='+Date.now()); if(!res.ok) throw 0;
  let mixes=await res.json();
  if(mixes.length==0) throw 0;
  if(!isOpen()) s.innerHTML='🔒 Voting Closed - Opens Sat 00:00 to Sun 23:59';
  else if(voted && voted.key==key) s.innerHTML='✅ You voted this weekend';
  else s.innerHTML='🎧 Voting OPEN - Sat to Sun - 1 vote per phone';
  l.innerHTML='';
  mixes.reverse().forEach(m=>{
   let dis=''; if(!isOpen()||(voted&&voted.key==key)) dis='disabled';
   l.innerHTML+=`<div class="card"><img src="${m.cover}"><div style="flex:1"><b>${m.title}</b></div><button ${dis} onclick="v('${m.id}',this)">${voted&&voted.id==m.id?'Your Vote ✓':'Vote'}</button></div>`;
  });
 }catch(e){
  s.innerHTML='No mixes yet. Go to admin.html and add first mix.';
  l.innerHTML='<p style="color:#666">Admin link: /admin.html</p>';
 }
}
async function v(id,btn){
 const k=weekKey(); const vo=JSON.parse(localStorage.getItem('lekompo_vote')||'null');
 if(vo&&vo.key==k){alert('One vote per weekend');return;}
 if(!isOpen()){alert('Voting closed');return;}
 btn.innerText='...'; btn.disabled=true;
 try{await fetch(`https://api.counterapi.dev/v1/lekompo-2026/${id}/up`);
 localStorage.setItem('lekompo_vote',JSON.stringify({id,key:k}));
 btn.innerText='Voted ✓'; document.getElementById('status').innerText='✅ Vote sent!';
 }catch{btn.innerText='Vote'; btn.disabled=false; alert('No internet');}
}
load();
</script>
</body>
</html>
