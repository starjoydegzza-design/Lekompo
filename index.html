<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lekompo Vote</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:white;margin:0;padding:20px}
h1{text-align:center;color:#ff0055}
.mix{background:#1a1a1a;border-radius:15px;padding:15px;margin:15px 0;display:flex;gap:15px;align-items:center}
.mix img{width:100px;height:100px;border-radius:10px;object-fit:cover}
.vote{margin-top:8px;padding:10px 20px;border:none;border-radius:20px;background:#00ff88;color:black;font-weight:bold}
.vote:disabled{background:#555;color:#aaa}
.closed{text-align:center;background:#331111;padding:10px;border-radius:10px;margin-bottom:10px;color:#ff8888}
</style>
</head>
<body>
<h1>🎧 Vote Your Favourite</h1>
<div id="status"></div>
<div id="mixes">Loading...</div>
<script>
const API="https://countapi.mileshilliard.com/api/v1";
const NS="lekompo-starjoydegzza-2026";
function openCheck(){
 const t=new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Johannesburg"}));
 return t.getDay()===6||t.getDay()===0;
}
async function load(){
 const open=openCheck();
 if(!open) document.getElementById('status').innerHTML='<div class="closed">⛔ Voting Closed — Only Sat 00:00 to Sun 23:59 SA Time</div>';
 const res=await fetch('mixes.json?t='+Date.now());
 const mixes=await res.json();
 const c=document.getElementById('mixes');c.innerHTML='';
 mixes.slice().reverse().forEach(m=>{
  const id=m.id||m.title.replace(/\s+/g,'-').toLowerCase();
  const voted=localStorage.getItem('voted-'+id);
  c.innerHTML+=`<div class="mix"><img src="${m.cover}"><div><div style="font-weight:bold">${m.title}</div><button class="vote" ${voted||!open?'disabled':''} onclick="vote('${id}',this)">${voted?'✅ Voted':open?'👍 Vote':'Closed'}</button></div></div>`;
 });
}
async function vote(id,btn){
 if(localStorage.getItem('voted-'+id))return;
 btn.textContent='Voting...';
 await fetch(`${API}/hit/${NS}_${id}`);
 localStorage.setItem('voted-'+id,'1');
 btn.textContent='✅ Voted';btn.disabled=true;
}
load();
</script>
</body>
</html>
