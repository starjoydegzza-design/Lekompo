<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lekompo Music</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
header{padding:20px;text-align:center;background:linear-gradient(90deg,#ff006a,#ffcc00);color:#000;font-weight:900;font-size:28px}
.container{max-width:900px;margin:auto;padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
.mix{background:#1a1a1a;border-radius:16px;overflow:hidden}
.mix img{width:100%;height:250px;object-fit:cover;background:#222}
.info{padding:12px}
.info h3{margin:5px 0}
.info p{color:#aaa;font-size:13px;margin:5px 0}
.btn{display:block;text-align:center;background:#1DB954;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:10px}
#empty{text-align:center;color:#666;padding:50px;grid-column:1/-1}
</style>
</head>
<body>
<header>LEKOMPO MUSIC</header>
<div class="container" id="list"><div id="empty">Loading mixes...</div></div>
<script>
async function load(){
 try{
  let res=await fetch('mixes.json?v='+Date.now());
  let mixes=await res.json();
  let list=document.getElementById('list');
  if(!mixes.length){list.innerHTML='<div id="empty">No mixes yet. Go to /admin.html to add first mix!</div>';return}
  list.innerHTML=mixes.map(m=>`
   <div class="mix">
    <img src="${m.cover||'https://via.placeholder.com/400x400?text=LEKOMPO'}" onerror="this.src='https://via.placeholder.com/400x400?text=LEKOMPO'">
    <div class="info">
     <h3>${m.title}</h3>
     <p>${m.artist||''} ${m.desc||''}</p>
     <a class="btn" href="${m.link}" target="_blank">▶ Play / Download</a>
    </div>
   </div>`).join('');
 }catch(e){document.getElementById('list').innerHTML='<div id="empty">Error loading mixes</div>'}
}
load();
</script>
</body>
</html>
