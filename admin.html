<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lekompo Admin - Live Votes</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0;padding:14px}
input{padding:16px;width:90%;max-width:300px;border-radius:12px;border:none;font-size:18px;text-align:center;margin:15px;display:block;margin-left:auto;margin-right:auto}
button{background:#ff1a5e;color:#fff;border:none;padding:16px 50px;border-radius:12px;font-weight:bold;font-size:18px;display:block;margin:10px auto}
#panel{display:none}
.card{background:#1a1a1a;padding:12px;border-radius:14px;margin:10px 0;display:flex;gap:12px;align-items:center;border-left:5px solid #ff1a5e}
.card img{width:70px;height:70px;border-radius:10px;object-fit:cover}
.totalBox{background:linear-gradient(90deg,#ff1a5e,#ff5e8a);padding:16px;border-radius:12px;text-align:center;font-weight:bold;font-size:20px;margin:12px 0}
.live{color:#00ff88;font-size:11px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>

<div id="loginScreen" style="text-align:center;padding-top:40px">
<h1 style="color:#ff1a5e">🔐 LEKOMPO ADMIN</h1>
<input id="pass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')loginNow()">
<button onclick="loginNow()">LOGIN</button>
<p id="msg" style="color:#ff5555"></p>
<p style="color:#444;font-size:12px">Password: lekompo123</p>
</div>

<div id="panel">
<h2 style="color:#ff1a5e;text-align:center">📊 LIVE VOTE COUNTING <span class="live">● LIVE</span></h2>
<div id="total" class="totalBox">Loading live votes...</div>
<div id="list"></div>
<button onclick="location.reload()" style="background:#333;width:100%">Logout</button>
</div>

<script>
function loginNow(){
  if(document.getElementById('pass').value.trim() === 'lekompo123'){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('panel').style.display='block';
    loadVotes();
    setInterval(loadVotes,3000); // COUNT EVERY 3 SECONDS LIVE
  }else{
    document.getElementById('msg').innerText='❌ Wrong password';
  }
}

async function loadVotes(){
  try{
    const r = await fetch('mixes.json?v='+Date.now());
    const mixes = await r.json();
    let total=0;
    let results=[];
    for(let m of mixes){
      let count=0;
      try{
        const res = await fetch('https://api.countapi.xyz/get/lekompo-2026-v1/'+m.id);
        const data = await res.json();
        count = data.value || 0;
      }catch(e){ count = 0; }
      total+=count;
      results.push({title:m.title, cover:m.cover, count:count});
    }
    results.sort((a,b)=>b.count-a.count);
    document.getElementById('total').innerHTML = `TOTAL: ${total} VOTES 🔥<br><span style="font-size:14px">LEADER: ${results[0]?.title||'No votes yet'} (${results[0]?.count||0})</span>`;
    let html='';
    results.forEach((m,i)=>{
      html+=`<div class="card" style="border-left-color:${i==0&&m.count>0?'#00ff88':'#ff1a5e'}"><img src="${m.cover}"><div style="flex:1"><b>${i==0&&m.count>0?'👑 ':''}${m.title}</b><br><span style="color:#ff8fab;font-size:18px;font-weight:bold">❤️ ${m.count} VOTES</span><br><span style="color:#888;font-size:11px">Rank #${i+1}</span></div></div>`;
    });
    document.getElementById('list').innerHTML = html || 'No mixes uploaded yet';
  }catch(e){
    document.getElementById('list').innerHTML='No mixes.json found - upload mixes first';
  }
}
</script>
</body>
</html>
