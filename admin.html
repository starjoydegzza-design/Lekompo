<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:20px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0}input{background:#222;color:#fff}button{background:#ff0055;color:#fff;font-weight:bold}</style>
</head><body>
<div id="l"><h2>Admin Login</h2><input id="p" type="password" placeholder="password"><button onclick="login()">Login</button><p id="e" style="color:red"></p></div>
<div id="a" style="display:none"><h2>Upload</h2><input id="t" placeholder="Title"><input id="c" placeholder="Artwork https://"><input id="tok" type="password" placeholder="GitHub token"><button onclick="up()">Upload</button><div id="b" style="margin-top:20px"></div></div>
<script>
const PASS="lekompo123";const API="https://countapi.mileshilliard.com/api/v1";const NS="lekompo-starjoydegzza-2026";
function login(){if(document.getElementById('p').value===PASS){l.style.display='none';a.style.display='block';load()}else{e.textContent='Wrong'}} 
async function load(){try{let r=await fetch('mixes.json?'+Date.now());let m=await r.json();let h='';for(let x of m){let id=x.id||x.title.toLowerCase().replace(/ /g,'-');let v=0;try{let rr=await fetch(`${API}/get/${NS}_${id}`);let dd=await rr.json();v=dd.value||0}catch{}h+=`<div style="background:#222;padding:10px;margin:5px;border-radius:8px;display:flex;gap:10px"><img src="${x.cover}" style="width:50px;height:50px;object-fit:cover"><div>${x.title}<br>Votes:${v}</div></div>`}b.innerHTML=h||'No mixes yet'}catch{b.innerHTML='Error'}}
async function up(){let title=t.value.trim(),cover=c.value.trim(),token=tok.value.trim();if(!title||!cover)return alert('need title+cover');let id=title.toLowerCase().replace(/\s+/g,'-')+'-'+Date.now();let nm={id,title,cover};try{let r=await fetch('https://api.github.com/repos/starjoydegzza-design/Lekompo/contents/mixes.json');let d=await r.json();let arr=JSON.parse(atob(d.content));arr.push(nm);let put=await fetch('https://api.github.com/repos/starjoydegzza-design/Lekompo/contents/mixes.json',{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'add '+title,content:btoa(JSON.stringify(arr,null,2)),sha:d.sha})});if(put.ok){alert('Done');load()}else alert('Token error')}catch(e){alert(e.message)}}
</script></body></html>
