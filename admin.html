button{background:#ff1a5e;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:bold;width:100%;max-width:400px;display:block;margin:10px auto;cursor:pointer}
#panel{display:none}
.card{background:#1a1a1a;padding:12px;border-radius:12px;margin:10px auto;display:flex;gap:12px;align-items:center;max-width:500px}
.card img{width:65px;height:65px;border-radius:10px;object-fit:cover}
.del{padding:8px 12px;background:#222;border:1px solid #ff1a5e;color:#ff5555;border-radius:8px;width:auto;margin:0}

.live{color:#ff8fab;font-weight:bold}

</head>
<body>

<div id="login" style="text-align:center;padding-top:70px">
<h1 style="color:#ff1a5e">ADMIN</h1>
<input id="p" type="password" placeholder="Password">
<button onclick="go()">LOGIN</button>
</div>

<div id="panel">
<h2 style="text-align:center;color:#ff1a5e">LIVE VOTES</h2>
<div id="total" style="text-align:center;background:#ff1a5e;padding:12px;border-radius:12px;max-width:500px;margin:auto;font-weight:bold">Loading...</div>

<div class="box">
<h3 style="color:#ff1a5e;text-align:center;margin:0 0 10px">ADD MIX</h3>
<input id="ghp" type="password" placeholder="Paste ghp_ token here (saved)">
<input id="title" placeholder="Mix Title">
<input id="cover" placeholder="Artwork URL (or upload below)">
<input type="file" id="file" accept="image/*">
<img id="prev" style="width:120px;border-radius:10px;display:none;margin:10px auto">
<button onclick="add()" style="background:#00ff88;color:#000">ADD + PUSH TO GITHUB</button>
<p id="status" style="text-align:center;font-size:13px;color:#888"></p>
</div>

<div id="list"></div>
</div>

<script>
const REPO="starjoydegzza-design/Lekompo";
const FILE_PATH="mixes.json";
let mixes=[], sha="";

function go(){
 if(document.getElementById('p').value!=='lekompo123'){alert('Wrong');return;}
 document.getElementById('login').style.display='none';
 document.getElementById('panel').style.display='block';
 const saved=localStorage.getItem('ghp_token');
 if(saved) document.getElementById('ghp').value=saved;
 load();
 setInterval(loadVotes,4000);
}

document.getElementById('file').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader();
 r.onload=ev=>{
  document.getElementById('cover').value=ev.target.result;
  document.getElementById('prev').src=ev.target.result;
  document.getElementById('prev').style.display='block';
 };
 r.readAsDataURL(f);
});

async function load(){
 const token=document.getElementById('ghp').value.trim() || localStorage.getItem('ghp_token') || '';
 try{
  if(token){
   const res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`,{headers:{Authorization:`token ${token}`}});
   const data=await res.json();
   sha=data.sha;
   mixes=JSON.parse(atob(data.content));
  } else {
   const res=await fetch(`${FILE_PATH}?v=${Date.now()}`);
   mixes=await res.json();
  }
 }catch(e){mixes=[];}
 loadVotes();
}
