<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lekompo Admin</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0;padding:14px}
input{padding:16px;width:90%;max-width:300px;border-radius:12px;border:none;font-size:18px;text-align:center;margin:15px auto;display:block}
button{background:#ff1a5e;color:#fff;border:none;padding:16px 50px;border-radius:12px;font-weight:bold;font-size:18px;display:block;margin:10px auto}
#panel{display:none}
.card{background:#1a1a1a;padding:12px;border-radius:14px;margin:10px 0;display:flex;gap:12px;align-items:center;border-left:5px solid #ff1a5e}
.card img{width:70px;height:70px;border-radius:10px;object-fit:cover}
.totalBox{background:linear-gradient(90deg,#ff1a5e,#ff5e8a);padding:16px;border-radius:12px;text-align:center;font-weight:bold;font-size:20px;margin:12px 0}
</style>
</head>
<body>
<div id="loginScreen" style="text-align:center;padding-top:50px">
<h1 style="color:#ff1a5e">🔐 LEKOMPO ADMIN</h1>
<input id="pass" type="password" placeholder="Password">
<button onclick="loginNow()">LOGIN</button>
<p id="msg" style="color:#ff5555"></p>
</div>
<div id="panel">
<h2 style="color:#ff1a5e;text-align:center">📊 LIVE VOTE COUNTING ● LIVE</h2>
<div id="total" class="totalBox">Loading live votes...</div>
<div id="list"></div>
<button onclick="location.reload()" style="background:#333;width:100%;margin-top:20px">Logout</button>
</div>
<script>
function loginNow(){
 if(document.getElementById('pass').value.trim()==='lekompo123'){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('panel').style.display='block';
  loadVotes();
  setInterval(loadVotes,3000);
 }else{
  document.getElementById('msg').innerText='❌ Wrong password';
 }
}
async function loadVotes(){
 const r=await fetch('mixes.json?v='+Date.now());
 const mixes=await r.json();
 let total=0,results=[];
 for(let m of mixes){
  let c=0;
  try{
   const res=await fetch('https://api.countapi.xyz/get/lekompo-2026-v1/'+m.id);
   const d=await res.json();
   c=d.value||0;
  }catch(e){c=0;}
  total+=c;
  results.push({title:m.title,cover:m.cover,count:c});
 }
 results.sort((a,b)=>b.count-a.count);
 document.getElementById('total').innerHTML=`TOTAL: ${total} VOTES 🔥<br><span style="font-size:14px">LEADER: ${results[0]?.title||'None'} (${results[0]?.count||0})</span>`;
 let html='';
 results.forEach((m,i)=>{
  html+=`<div class="card"><img src="${m.cover}"><div style="flex:1"><b>${i==0&&m.count>0?'👑 ':''}${m.title}</b><br><span style="color:#ff8fab;font-weight:bold">❤️ ${m.count} VOTES</span></div><div>#${i+1}</div></div>`;
 });
 document.getElementById('list').innerHTML=html;
}
</script>
</body>
</html>
