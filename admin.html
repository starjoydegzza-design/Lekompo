<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Lekompo</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:12px}
h1{color:#ff1a5e;text-align:center}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none}
button{background:#ff1a5e;color:#fff;font-weight:bold}
.card{background:#1a1a1a;border-radius:12px;padding:10px;margin:8px 0;display:flex;align-items:center;gap:10px}
.card img{width:50px;height:50px;border-radius:8px;object-fit:cover}
.badge{margin-left:auto;background:#ff1a5e;padding:4px 10px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<h1>🎧 Admin Dashboard</h1>
<input id="title" placeholder="Title">
<input type="file" id="file">
<input id="token" placeholder="Token ghp_...">
<button onclick="upload()">Upload</button>
<div id="stats" style="text-align:center;margin:15px;color:#aaa">Loading votes...</div>
<div id="list"></div>
<script>
const NAMESPACE = "lekompo-2026-v1"; // unique for your site

async function load(){
  const mixes = await (await fetch('mixes.json?v='+Date.now())).json();
  const list=document.getElementById('list');
  list.innerHTML='';
  let totalVotes = 0;
  for(let m of mixes){
    // Get vote count from free API
    let count = 0;
    try{
      const r = await fetch(`https://api.countapi.xyz/get/${NAMESPACE}/${m.id}`);
      const d = await r.json();
      count = d.value || 0;
    }catch(e){ count = 0; }
    totalVotes += count;
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<img src="${m.cover}"><span>${m.title}</span><span class="badge">❤️ ${count}</span>`;
    list.appendChild(div);
  }
  document.getElementById('stats').innerText = `${mixes.length} mixes | ${totalVotes} total votes`;
}
load();

// Your old upload function stays same - add it here below
async function upload(){
  alert("Use your old upload code here - keep your existing function, or tell me to add it back");
}
</script>
</body>
</html>
